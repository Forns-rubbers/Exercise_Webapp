<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login Form!!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <div class="left-login">
            <img src="media/img/charactor-login.png" alt="">
        </div>
        <div class="right-login">
            <div class="login-logo">
                <img src="media/img/logo-login.png" alt="">
            </div>
            <form id="login-form">
                <div class="email-blog">
                    <input id="email" name="email" type="email" placeholder="USERNAME : " required> <br><br>
                </div>
                <div class="password-blog">
                    <input id="password" name="password" type="password" placeholder="PASSWORD : " required><br>
                    <a href="#">
                        <p>
                            FORGET PASSWORD?
                        </p>
                    </a>
                </div>
                <button type="submit">LOGIN</button>
            </form>
            <p id="message" class="auth-message" role="alert"></p>
            <a class="register-link" href="register.html">CREATE AN ACCOUNT</a>
            <div class="buttom-logo">
                <img src="media/img/bt-logo-login.png" alt="">
            </div>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
