<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Coupons | Fitz Daily Exercise</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Chewy&display=swap">
  <link rel="stylesheet" href="css/coupon.css">
</head>
<body>
  <main class="coupon-app">
    <header class="coupon-heading"><a class="back-link" href="mission.html" aria-label="กลับหน้าหลัก">⌂</a><h1>COUPON</h1><span class="heading-spacer"></span></header>
    <aside class="warning" role="note">⚠ คูปองใช้ได้ครั้งเดียวโปรดอย่ากดเล่นและใช้อย่างระมัดระวัง</aside>
    <section id="couponList" class="coupon-list" aria-label="รายการคูปอง"></section>
    <nav class="bottom-nav" aria-label="เมนูหลัก">
      <button class="selected" type="button" id="coupon" aria-label="คูปอง" aria-current="page">🎟️</button>
      <button type="button" aria-label="หน้าหลัก" onclick="location.href='mission.html'">⌂</button>
      <button type="button" aria-label="Ranking" onclick="location.href='ranking.html'">🏆</button>
    </nav>
  </main>

  <div id="couponModal" class="modal" aria-hidden="true">
    <div class="modal-shade" data-close-coupon></div>
    <section class="coupon-detail" role="dialog" aria-modal="true" aria-labelledby="detailName">
      <button id="closeCoupon" class="close-coupon" type="button" aria-label="ปิด">×</button>
      <img id="detailImage" class="detail-image" alt="รูปร้านค้า">
      <h2 id="detailName"></h2>
      <p id="detailDescription"></p>
      <button id="redeemCoupon" class="redeem-button" type="button">แลกคูปอง</button>
      <p id="redeemMessage" class="redeem-message" aria-live="polite"></p>
    </section>
  </div>
  <script type="module" src="js/coupon.js"></script>
</body>
</html>
