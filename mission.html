<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitz Daily Exercise – Mission</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Chewy&display=swap">
<style>
:root{--teal:#00d4b1;--navy:#0b1a3a;--orange:#ff8f00;--cream:#fce8a8;--lime:#dcee63;--dark:#1b2020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050c1f;font-family:'Mali','Noto Sans Thai',sans-serif}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--navy);overflow:hidden}
header{position:absolute;top:0;left:0;right:0;z-index:5;height:calc(76px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:var(--teal);display:flex;align-items:center;gap:12px}
.avatar{width:54px;height:54px;border-radius:50%;background:#ff3535;display:grid;place-items:center;font-size:30px}
.who{flex:1;line-height:1}
.who b{font-family:'Chewy',cursive;font-size:26px;letter-spacing:1px;display:block}
.who span{font-size:13px}
.gear{font-size:30px;background:none;border:0;cursor:pointer}
#scroll{position:absolute;inset:0;overflow-y:auto;padding-top:calc(76px + env(safe-area-inset-top,0px));padding-bottom:84px}
#map{position:relative;width:100%}
#pattern{position:absolute;inset:0;opacity:.28;font-size:44px;line-height:1.5;letter-spacing:14px;word-break:break-all;overflow:hidden;filter:saturate(.5);pointer-events:none}
#lines{position:absolute;inset:0}
.node{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:7px solid #ff9a00;background:radial-gradient(circle at 35% 30%,#ffe58a,#fdc94f);color:#ff8a2b;font:700 38px/62px 'Mali',sans-serif;text-align:center;cursor:pointer;box-shadow:0 4px 10px #0008;padding:0}
.node.cur{border-color:#13a557;background:radial-gradient(circle at 35% 30%,#7dffb0,#21e87c);color:#0e9f4f;width:92px;height:92px;margin:-46px 0 0 -46px;font-size:50px;line-height:76px}
.node.lock{opacity:.85}
.node.cur::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid #21e87c;animation:p 1.6s infinite}
@keyframes p{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
nav{position:absolute;bottom:0;left:0;right:0;z-index:5;height:calc(70px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:#12161a}
nav button{flex:1;border:0;background:none;font-size:34px;cursor:pointer;color:#fff}
nav button.on{background:var(--dark)}
.ov{position:absolute;inset:0;z-index:10;display:none}
.ov.show{display:block}
#modalBg{background:#000a;display:none;align-items:center;justify-content:center}
#modalBg.show{display:flex}
.card{width:84%;background:var(--orange);border-radius:30px;padding:14px 22px 22px;box-shadow:0 10px 30px #000a;animation:pop .2s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card .top{display:flex;justify-content:space-between;align-items:center;height:96px}
.card .no{font-size:42px;font-weight:600}
.card .ic{font-size:60px;flex:1;text-align:center}
.card .in{background:var(--cream);border-radius:26px;padding:22px 16px 18px;text-align:center}
.card h2{margin:6px 0 14px;font-size:40px;font-weight:600}
.card p{margin:0 0 20px;font-size:19px;font-weight:700;line-height:1.5}
.btn{display:block;width:100%;border:0;border-radius:40px;font:700 28px 'Mali',sans-serif;padding:12px;cursor:pointer}
.go{background:var(--lime);color:#000}
#up{background:var(--orange);overflow-y:auto;padding:calc(30px + env(safe-area-inset-top,0px)) 20px 24px;text-align:center}
.mbox{background:#fde8a9;border-radius:34px;padding:22px 16px;font-size:23px;font-weight:700;line-height:1.5}
.hint{font-size:16px;font-weight:700;margin:16px 0}
#drop{position:relative;height:50vh;min-height:300px;border:4px dashed #000;border-radius:34px;background:var(--lime);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-size:22px;font-weight:700}
#drop .plus{font-size:80px;line-height:1;color:#2b2f33}
#drop img,#drop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#send{background:var(--dark);color:#fff;margin-top:20px;padding:26px 12px;font-size:26px}
#send:disabled{opacity:.55}
.note{font-size:18px;font-weight:700;margin:14px 0}
.logo{font:400 64px 'Chewy',cursive;margin-top:18px;background:linear-gradient(90deg,#f33 25%,#fc3 25% 50%,#3a9de0 50% 75%,#ee6a9c 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font:700 12px 'Mali';color:#0a6;-webkit-text-fill-color:#0a6;margin-top:-8px}
.back{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;background:none;border:0;font-size:28px;cursor:pointer;z-index:2}
#toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;z-index:20;display:none;font-size:16px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">🥑</div>
    <div class="who"><b>USERNAME</b><span>ID : 000000</span></div>
    <button class="gear" aria-label="ตั้งค่า">⚙️</button>
  </header>
  <div id="scroll"><div id="map"><div id="pattern"></div><svg id="lines"></svg></div></div>
  <nav><button aria-label="คูปอง">🎟️</button><button class="on" aria-label="หน้าหลัก">🏠</button><button aria-label="อันดับ">🏆</button></nav>

  <div id="modalBg" class="ov"><div class="card" id="card"></div></div>

  <div id="up" class="ov">
    <button class="back" id="back" aria-label="กลับ">←</button>
    <div class="mbox" id="umission"></div>
    <div class="hint">สามารถส่งหลักฐานเป็นภาพหรือคลิปวิดิโอที่เห็นถึง<br>การทำภารกิจดังกล่าวได้อย่างชัดเจน</div>
    <div id="drop"><div class="plus">+</div><div>เพิ่มรูปภาพ/คลิปวิดิโอ</div></div>
    <input type="file" id="file" accept="image/*,video/*" hidden>
    <button class="btn" id="send" disabled>ส่งหลักฐานเพื่อตรวจสอบ</button>
    <div class="note">กรุณาตรวจสอบหลักฐานก่อนส่ง</div>
    <div class="logo">Fitz<small>Daily Exercise</small></div>
  </div>
  <div id="toast"></div>
</div>

<script>
const M=[
["TU Native","เดินออกกำลังกายอย่างน้อย 20 นาที","👣"],["Morning Stretch","ยืดเหยียดร่างกายอย่างน้อย 10 นาที","🧘"],
["Team Player","เล่นกีฬาอะไรก็ได้กับเพื่อน อย่างน้อย 30 นาที","⚽"],["Stair Master","เดินขึ้นบันไดแทนลิฟต์ อย่างน้อย 5 ชั้น","🪜"],
["Jump Start","กระโดดเชือกอย่างน้อย 5 นาที","🪢"],["Push It","วิดพื้นสะสมอย่างน้อย 20 ครั้ง","💪"],
["Cardio Day","วิ่งเหยาะๆ อย่างน้อย 15 นาที","🏃"],["Plank Time","แพลงก์รวมอย่างน้อย 3 นาที","🧱"],
["Bike Ride","ปั่นจักรยานอย่างน้อย 30 นาที","🚴"],["Squat Up","สควอทอย่างน้อย 30 ครั้ง","🦵"],
["Dance Party","เต้นออกกำลังกายอย่างน้อย 15 นาที","💃"],["Swim Fun","ว่ายน้ำอย่างน้อย 20 นาที","🏊"],
["Core Power","ทำท่าซิทอัพอย่างน้อย 30 ครั้ง","🔥"],["Park Walk","เดินเล่นที่สวนสาธารณะ 30 นาที","🌳"],
["Yoga Flow","เล่นโยคะอย่างน้อย 20 นาที","🧘"],["Badminton","เล่นแบดมินตันกับเพื่อน 30 นาที","🏸"],
["Run 3K","วิ่งให้ครบ 3 กิโลเมตร","🏅"],["Lunge Walk","ทำท่า Lunge อย่างน้อย 20 ครั้ง","🚶"],
["Hydrate","ดื่มน้ำให้ครบ 8 แก้ว พร้อมออกกำลังกาย 10 นาที","💧"],["Basketball","เล่นบาสเกตบอลอย่างน้อย 30 นาที","🏀"],
["Burpee Boss","เบอร์พีอย่างน้อย 15 ครั้ง","⚡"],["Night Walk","เดินตอนเย็นอย่างน้อย 30 นาที","🌙"],
["Football","เตะฟุตบอลกับเพื่อนอย่างน้อย 30 นาที","⚽"],["HIIT","ออกกำลังกายแบบ HIIT อย่างน้อย 15 นาที","🔥"],
["Table Tennis","เล่นปิงปองอย่างน้อย 30 นาที","🏓"],["Hill Climb","เดินขึ้นเนินหรือสะพานลอย 10 นาที","⛰️"],
["Volleyball","เล่นวอลเลย์บอลอย่างน้อย 30 นาที","🏐"],["Run 5K","วิ่งให้ครบ 5 กิโลเมตร","🏆"],
["Active Friends","ชวนเพื่อนออกกำลังกายด้วยกัน 45 นาที","🤝"],["Champion","ออกกำลังกายต่อเนื่องอย่างน้อย 60 นาที","👑"]];
const N=M.length;
let cur=1,sel=0,fileUrl=null;
try{cur=Math.min(N,parseInt(localStorage.getItem('fitzCur'))||1)}catch(e){}
const $=id=>document.getElementById(id);
$('pattern').textContent=("🥑🍌🍅🍉🥦🍕⭐").repeat(400);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
function pos(i,W){const j=[0,.01,.02,-.01,.015][i%5];return{x:W*(i%2===0?.24+j:.73+j),y:110+i*118}}
function draw(){
  const map=$('map'),W=map.clientWidth,H=110+N*118+40;
  map.style.height=H+'px';
  const svg=$('lines');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.height=H+'px';
  let s='';
  for(let i=0;i<N-1;i++){const a=pos(i,W),b=pos(i+1,W);
    s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${i+1<cur?'#13a557':'#ff9300'}" stroke-width="22" stroke-linecap="round"/>`}
  svg.innerHTML=s;
  map.querySelectorAll('.node').forEach(n=>n.remove());
  for(let i=0;i<N;i++){const p=pos(i,W),n=i+1,b=document.createElement('button');
    b.className='node'+(n<=cur?' cur':'')+(n>cur?' lock':'');
    if(n<cur){b.classList.remove('cur');b.style.cssText+=';border-color:#13a557;background:radial-gradient(circle at 35% 30%,#7dffb0,#21e87c);color:#0e9f4f'}
    b.style.left=p.x+'px';b.style.top=p.y+'px';b.textContent=n;
    b.onclick=()=>openCard(n);$('map').appendChild(b)}
}
function openCard(n){
  if(n>cur){toast('🔒 ต้องผ่านด่าน '+(n-1)+' ก่อน');return}
  sel=n;const m=M[n-1];
  $('card').innerHTML=`<div class="top"><span class="no">${String(n).padStart(2,'0')}</span><span class="ic">${m[2]}</span><span style="width:42px"></span></div>
  <div class="in"><h2>${m[0]}</h2><p>ภารกิจ : ${m[1]}</p><button class="btn go" id="start">เริ่ม</button></div>`;
  $('modalBg').classList.add('show');
  $('start').onclick=startMission;
}
$('modalBg').onclick=e=>{if(e.target.id==='modalBg')$('modalBg').classList.remove('show')};
function resetUp(){
  fileUrl&&URL.revokeObjectURL(fileUrl);fileUrl=null;$('file').value='';
  $('drop').innerHTML='<div class="plus">+</div><div>เพิ่มรูปภาพ/คลิปวิดิโอ</div>';
  $('send').disabled=true;$('send').textContent='ส่งหลักฐานเพื่อตรวจสอบ';
}
function startMission(){
  $('modalBg').classList.remove('show');resetUp();
  $('umission').innerHTML='ภารกิจ : '+M[sel-1][1].replace(/ อย่างน้อย/,'<br>อย่างน้อย');
  $('up').classList.add('show');
}
$('back').onclick=()=>$('up').classList.remove('show');
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  fileUrl&&URL.revokeObjectURL(fileUrl);fileUrl=URL.createObjectURL(f);
  $('drop').innerHTML=f.type.startsWith('video')?`<video src="${fileUrl}" controls playsinline></video>`:`<img src="${fileUrl}" alt="หลักฐาน">`;
  $('send').disabled=false;
};
$('send').onclick=()=>{
  $('send').disabled=true;$('send').textContent='กำลังส่ง...';
  setTimeout(()=>{
    if(sel===cur&&cur<N){cur++;try{localStorage.setItem('fitzCur',cur)}catch(e){}}
    $('up').classList.remove('show');draw();toast('✅ ส่งหลักฐานแล้ว รอการตรวจสอบ');
    const y=pos(Math.min(cur,N)-1,$('map').clientWidth).y;$('scroll').scrollTo({top:y-200,behavior:'smooth'});
  },900);
};
addEventListener('resize',draw);draw();
$('scroll').scrollTop=Math.max(0,pos(cur-1,$('map').clientWidth).y-250);
</script>
</body>
</html>
