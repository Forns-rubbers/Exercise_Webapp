<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fitz — Exercise Location</title>

    <link rel="stylesheet" href="css/tqa.css">
    <script src="js/tqa.js" defer></script>
</head>

<body>
    <main class="page">
        <h1>ปกติแล้วคุณออกกำลังกายที่ไหน?</h1>

        <form id="locationForm">
            <div class="options">
                <button type="button" class="option selected" data-location="fitness" aria-pressed="true">
                    <svg viewBox="0 0 100 100" aria-hidden="true">
                        <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round">
                            <path d="M22 37v26 M34 25v50 M46 32v36
                                     M54 50h12 M70 32v36 M82 25v50" />
                        </g>
                    </svg>
                    <span class="option-title">ฟิตเนส</span>
                </button>

                <button type="button" class="option" data-location="home_no_equipment" aria-pressed="false">
                    <svg viewBox="0 0 100 100" aria-hidden="true">
                        <g fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"
                            stroke-linecap="round">
                            <path d="M12 43 50 12 88 43" />
                            <path d="M23 38v48h54V38" />
                            <path d="M42 86V58h18v28" />
                        </g>
                    </svg>
                    <span class="option-title">บ้าน</span>
                    <span class="option-subtitle">(ไม่มีอุปกรณ์)</span>
                </button>

                <button type="button" class="option" data-location="home_with_equipment" aria-pressed="false">
                    <svg viewBox="0 0 100 100" aria-hidden="true">
                        <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M19 24 31 14 43 31 67 54
                                     82 67 91 80 87 87 72 85
                                     57 76 39 59 22 43Z" />
                            <path d="M14 70h32 M8 81h40" />
                            <path d="m39 59 12-12 M31 14l-8 29" />
                        </g>
                    </svg>
                    <span class="option-title">บ้าน</span>
                    <span class="option-subtitle">(มีอุปกรณ์)</span>
                </button>
            </div>

            <button class="confirm-button" type="submit">
                CONFIRM
            </button>
        </form>

        <div class="brand" aria-label="Fitz Daily Exercise">
            <span class="brand-icon">F</span><span class="brand-name">itz</span>
            <small>Daily Exercise</small>
        </div>
    </main>
</body>

</html>
