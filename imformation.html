<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitz — Information</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #2361c7;
      --cream: #ffedb4;
      --ink: #1d2020;
      --tomato: #d35b50;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      font-family: "DM Sans", sans-serif;
      background: var(--blue);
      color: var(--ink);
    }

    main {
      min-height: 100vh;
      padding: clamp(12px, 2.4vw, 40px);
      display: grid;
      place-items: center;
    }

    .card {
      width: min(100%, 1520px);
      min-height: min(94vh, 1040px);
      padding: clamp(42px, 7vw, 104px) clamp(24px, 12vw, 190px) 50px;
      background: var(--cream);
      border-radius: clamp(70px, 16vw, 260px) 0 clamp(70px, 16vw, 260px) 0;
      box-shadow: inset 0 0 70px rgb(171 121 36 / 8%);
    }

    h1 {
      margin: 0;
      text-align: center;
      color: black;
      font: 800 clamp(3.6rem, 7.1vw, 7.6rem) / .8 "Baloo 2", cursive;
      letter-spacing: .025em;
    }

    .subtitle {
      margin: 22px auto 0;
      max-width: 520px;
      color: #705f37;
      text-align: center;
      font-size: .95rem;
    }

    form {
      max-width: 1020px;
      margin: clamp(42px, 8vh, 76px) auto 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px 48px;
    }

    .field {
      min-height: 110px;
      padding: 0 42px;
      display: flex;
      align-items: center;
      gap: 28px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: rgb(255 250 225 / 18%);
    }

    .field-title {
      flex: 0 0 auto;
      font-size: 1.06rem;
      font-weight: 700;
      letter-spacing: .03em;
    }

    input, select {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--tomato);
      font: 500 1.07rem "DM Sans", sans-serif;
    }

    input::placeholder {
      color: var(--tomato);
      opacity: 1;
    }

    select {
      cursor: pointer;
    }

    select:invalid {
      color: #756950;
    }

    .number-input {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .unit {
      color: var(--ink);
      font-style: normal;
      font-size: 1rem;
    }

    .username {
      width: min(100%, 594px);
      margin: 42px auto 0;
    }

    button {
      width: min(100%, 600px);
      min-height: 112px;
      margin: 42px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      border: 3px solid black;
      border-radius: 999px;
      background: var(--ink);
      box-shadow: 0 5px 0 black;
      color: white;
      cursor: pointer;
      font: 700 clamp(2rem, 3.1vw, 3.5rem) / 1 "DM Sans", sans-serif;
      transition: .18s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 black;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 black;
    }

    #message {
      min-height: 22px;
      margin: 14px 0 -25px;
      color: #b13c34;
      text-align: center;
      font-weight: 700;
    }

    .logo {
      width: max-content;
      margin: 58px auto 0;
      font: 800 3.7rem / .7 "Baloo 2", cursive;
      letter-spacing: -.18em;
      transform: rotate(-4deg);
    }

    .logo .f { color: #e94c43; }
    .logo .i { color: #e5b83d; font-style: normal; }
    .logo .t { color: #3479c9; }
    .logo .z { color: #df5da0; }

    @media (max-width: 760px) {
      main {
        padding: 0;
        display: block;
      }

      .card {
        min-height: 100vh;
        padding: 60px 20px 32px;
        border-radius: 0 0 70px 70px;
      }

      h1 {
        font-size: clamp(3.1rem, 15vw, 5rem);
      }

      .subtitle {
        font-size: .88rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .field {
        min-height: 72px;
        padding: 0 22px;
        gap: 18px;
      }

      .field-title {
        font-size: .8rem;
      }

      input, select {
        font-size: .92rem;
      }

      .username {
        margin-top: 16px;
      }

      button {
        min-height: 76px;
        margin-top: 28px;
        font-size: 2rem;
      }
    }

    @media (max-width: 390px) {
      .field {
        padding: 0 17px;
        gap: 12px;
      }

      .field-title {
        font-size: .72rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="card">
      <h1>INFORMATION</h1>
      <p class="subtitle">Tell us a little about yourself to personalise your wellness plan.</p>

      <form id="profileForm" novalidate>
        <div class="grid">
          <label class="field">
            <span class="field-title">GENDER</span>
            <select required>
              <option value="" selected disabled>Select gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Non-binary</option>
              <option>Prefer not to say</option>
            </select>
          </label>

          <label class="field">
            <span class="field-title">WEIGHT</span>
            <span class="number-input">
              <input type="number" min="1" max="500" placeholder="00" required>
              <span class="unit">KG</span>
            </span>
          </label>

          <label class="field">
            <span class="field-title">BIRTHDAY</span>
            <input type="date" required>
          </label>

          <label class="field">
            <span class="field-title">HEIGHT</span>
            <span class="number-input">
              <input type="number" min="30" max="300" placeholder="00" required>
              <span class="unit">CM</span>
            </span>
          </label>
        </div>

        <label class="field username">
          <span class="field-title">USERNAME</span>
          <input id="username" type="text" minlength="2" maxlength="24" placeholder="TOMATO" required>
        </label>

        <p id="message"></p>

        <button type="submit">
          NEXT <span>→</span>
        </button>
      </form>

      <div class="logo" aria-label="Fitz">
        <span class="f">F</span><span class="i">i</span><span class="t">t</span><span class="z">z</span>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#profileForm");
    const message = document.querySelector("#message");
    const username = document.querySelector("#username");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!form.checkValidity()) {
        message.style.color = "#b13c34";
        message.textContent = "Please complete all fields to continue.";
        form.reportValidity();
        return;
      }

      message.style.color = "#2d8a55";
      message.textContent = `Welcome, ${username.value.trim()}! Your profile is ready.`;
    });

    form.addEventListener("input", () => {
      message.textContent = "";
    });
  </script>
</body>
</html>
