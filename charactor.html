<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charactor</title>
    <link rel="stylesheet" href="css/charactor.css">
</head>

<body>

    <main>
        <section class="header">
            <img src="media/img/profile-char.png" alt="">
        </section>


        <section class="charctor-select">
            <img id="characterImage" src="media/img/tomato.png" alt="Tomato">
        </section>

        <section class="button-action">
            <button id="prebtn" class="arrow" aria-label="Previous character" type="button">
                ◀
            </button>

            <button id="confirm" class="confirm" type="button">
                CONFIRM
            </button>

            <button id="nextbtn" class="arrow" aria-label="Next character" type="button">
                ▶
            </button>
        </section>

        <script src="js/charactor.js"></script>


        <footer class="fitz">
            <img src="" alt="">
        </footer>
    </main>


    <script src="/js/charactor.js"></script>
</body>

</html>
